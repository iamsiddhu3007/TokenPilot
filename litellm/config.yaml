# LiteLLM proxy — the BYOK gateway. The wildcard route proxies any
# "<provider>/<model>" to that provider, using the api_key the app passes
# per request (each team's own decrypted key). No provider keys live here.
model_list:
  - model_name: "*"
    litellm_params:
      model: "*"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
